<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Esplora — ROAM</title>

    <link
        rel="stylesheet"
        href="css/global.css"
    >

</head>


<body>

    <main class="app">

        <header class="top-header">

            <div>

                <span class="eyebrow">
                    SCOPRI
                </span>

                <h1>
                    Esplora
                </h1>

            </div>

        </header>


        <div class="hero-search">

            <div class="search-icon">
                ⌕
            </div>

            <input
                id="exploreInput"
                type="text"
                placeholder="Cerca una destinazione..."
            >

            <button onclick="exploreDestination()">
                →
            </button>

        </div>


        <section class="section">

            <div id="exploreContent">

                <div class="empty-state">

                    <strong>
                        Dove vuoi andare?
                    </strong>

                    <p>
                        Cerca una città o una destinazione
                        per iniziare a esplorare.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <nav class="bottom-nav">

        <a href="index.html" class="nav-item">
            <span class="nav-icon">⌂</span>
            <span>Home</span>
        </a>

        <a href="esplora.html" class="nav-item active">
            <span class="nav-icon">⌕</span>
            <span>Esplora</span>
        </a>

        <a href="viaggi.html" class="nav-item">
            <span class="nav-icon">◈</span>
            <span>Viaggi</span>
        </a>

        <a href="rullino.html" class="nav-item">
            <span class="nav-icon">▣</span>
            <span>Rullino</span>
        </a>

        <a href="profilo.html" class="nav-item">
            <span class="nav-icon">○</span>
            <span>Profilo</span>
        </a>

    </nav>


    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                const savedDestination =
                    localStorage.getItem(
                        "roam_explore_destination"
                    );

                if (savedDestination) {

                    document.getElementById(
                        "exploreInput"
                    ).value = savedDestination;

                    showDestinationPreview(
                        savedDestination
                    );

                }

            }
        );


        function exploreDestination() {

            const input =
                document.getElementById(
                    "exploreInput"
                );

            const destination =
                input.value.trim();

            if (!destination) {

                input.focus();

                return;

            }

            localStorage.setItem(
                "roam_explore_destination",
                destination
            );

            showDestinationPreview(
                destination
            );

        }


        function showDestinationPreview(
            destination
        ) {

            const container =
                document.getElementById(
                    "exploreContent"
                );

            container.innerHTML = `

                <div class="section">

                    <span class="eyebrow">
                        DESTINAZIONE
                    </span>

                    <h2
                        style="
                            font-size:32px;
                            margin-top:6px;
                            margin-bottom:24px;
                        "
                    >
                        ${escapeHTML(destination)}
                    </h2>

                    <div class="quick-grid">

                        <button class="quick-card">
                            <span class="quick-icon">
                                ◉
                            </span>

                            <strong>
                                Da vedere
                            </strong>

                            <small>
                                Luoghi imperdibili
                            </small>
                        </button>

                        <button class="quick-card">
                            <span class="quick-icon">
                                ☆
                            </span>

                            <strong>
                                Cose da fare
                            </strong>

                            <small>
                                Attività ed esperienze
                            </small>
                        </button>

                        <button class="quick-card">
                            <span class="quick-icon">
                                ◇
                            </span>

                            <strong>
                                Dove mangiare
                            </strong>

                            <small>
                                Ristoranti e locali
                            </small>
                        </button>

                        <button class="quick-card">
                            <span class="quick-icon">
                                ◎
                            </span>

                            <strong>
                                Zone
                            </strong>

                            <small>
                                Scopri la città
                            </small>
                        </button>

                    </div>

                </div>

            `;

        }

    </script>

</body>

</html>
